#
# microk8s-multinode-workload-test
#
# Deploy three nginx nodes behind a TCP load balancer.
#
# We don't really need an filesystem for this test, so let's take the
# simpler path and use a ConfigMap mount its contents into the pods.
#
# Test will download URL http://xxxx/microk8s-test-result.txt through
# the LoadBalancer external IP and check if the contents is "OK".
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: static-site-config
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Multi-node static Nginx test</title>
    </head>
    <body>
        <h1>Multi-node static Nginx test</h1>
        <p> debug-multi-node-workload-ok </p>
    </body>
    </html>
  microk8s-test-result.txt: "OK\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-static-site
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: static-content
          mountPath: /usr/share/nginx/html
      volumes:
      - name: static-content
        configMap:
          name: static-site-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-static-site
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: nginx
