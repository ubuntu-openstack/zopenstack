# Sunbeam CORE control-plane bundle for single-LPAR s390x verification.
#
# Hand-rolled equivalent of snap-openstack's `deploy-openstack` Terraform plan,
# derived verbatim from the upstream zaza functional-test bundle
# sunbeam-charms/tests/openstack/smoke.yaml.j2 with every feature charm removed
# (no horizon/heat/octavia/magnum/manila/barbican/designate/ironic/telemetry/
# images-sync/ldap, and no in-bundle tempest-k8s -- tempest-k8s has no s390x OCI
# image so Tempest runs via upstream tox in phase 06 instead).
#
# This is the K8s half of a two-model deployment. Deploy it into the `openstack`
# CAAS model on the Canonical K8s cloud:
#
#   juju add-model openstack <k8s-cloud>
#   juju deploy ./control-plane-k8s-s390x.yaml --trust
#
# It EXPORTS the cross-model offers (amqp, identity-*, send-ca-cert,
# certificates, nova-service, cinder-database) that the machine-plane bundle
# (machine-lpar-s390x.yaml) consumes for the hypervisor + cinder-volume +
# microceph. It also requires the `storage-backend` and `ovsdb-cms` offers that
# the machine bundle exports back (cinder-volume and sunbeam-ovn-proxy
# respectively) -- phase 03b wires those up after both models exist.
#
# ovn-central-k8s and ovn-relay-k8s are retired. The machine-plane bundle now
# runs microovn + sunbeam-ovn-proxy; neutron-k8s consumes the machine model's
# ovsdb-cms offer during phase 03b.
#
# Channels follow the currently published s390x charm revisions (see README
# "Channel pins"). Resources are intentionally omitted: deploying from charmhub
# makes Juju pull each revision's published OCI image; phase 05 sweeps those
# images from the running pods for per-image s390x gaps.
bundle: kubernetes

applications:
  mysql:
    charm: mysql-k8s
    channel: 8.0/stable
    base: ubuntu@22.04
    scale: 1
    trust: true
    options:
      profile-limit-memory: 6202
      experimental-max-connections: 466
  rabbitmq:
    charm: rabbitmq-k8s
    channel: 4.0/edge
    base: ubuntu@24.04
    scale: 1
    trust: true
    options:
      minimum-replicas: 1
  tls-operator:
    charm: self-signed-certificates
    # 1/beta has no s390x revision; 1/edge revision 327 is the current
    # Ubuntu 24.04/s390x build.
    channel: 1/edge
    base: ubuntu@24.04
    scale: 1
    options:
      ca-common-name: internal-ca
  traefik:
    charm: traefik-k8s
    # The s390x revisions on latest/candidate are Ubuntu 26.04 only; there is
    # no s390x ubuntu@20.04 revision. latest/edge carries the same build.
    channel: latest/edge
    base: ubuntu@26.04
    scale: 1
    trust: true
    # The Canonical K8s load-balancer add-on assigns an external IP to a
    # LoadBalancer service; no MetalLB-specific annotation is required.
    options:
      kubernetes-service-type: LoadBalancer
  keystone:
    charm: keystone-k8s
    channel: 2026.1/edge
    base: ubuntu@24.04
    scale: 1
    trust: true
    storage:
      fernet-keys: 5M
      credential-keys: 5M
  glance:
    charm: glance-k8s
    channel: 2026.1/edge
    base: ubuntu@24.04
    scale: 1
    trust: true
    storage:
      local-repository: 10G
  placement:
    charm: placement-k8s
    channel: 2026.1/edge
    base: ubuntu@24.04
    scale: 1
    trust: true
  nova:
    charm: nova-k8s
    channel: 2026.1/edge
    base: ubuntu@24.04
    scale: 1
    trust: true
  neutron:
    charm: neutron-k8s
    channel: 2026.1/edge
    base: ubuntu@24.04
    scale: 1
    trust: true
    options:
      debug: true
  cinder-router:
    charm: mysql-router-k8s
    channel: 8.0/edge
    base: ubuntu@22.04
    scale: 1
    trust: true
    options:
      expose-external: loadbalancer
  cinder:
    charm: cinder-k8s
    channel: 2026.1/edge
    base: ubuntu@24.04
    scale: 1
    trust: true

relations:
  - - mysql:database
    - keystone:database
  - - traefik:ingress
    - keystone:ingress-internal
  - - rabbitmq:amqp
    - keystone:amqp

  - - mysql:database
    - glance:database
  - - keystone:identity-service
    - glance:identity-service
  - - rabbitmq:amqp
    - glance:amqp
  - - traefik:ingress
    - glance:ingress-internal
  - - keystone:send-ca-cert
    - glance:receive-ca-cert

  - - mysql:database
    - nova:database
  - - mysql:database
    - nova:api-database
  - - mysql:database
    - nova:cell-database
  - - rabbitmq:amqp
    - nova:amqp
  - - keystone:identity-service
    - nova:identity-service
  - - traefik:ingress
    - nova:ingress-internal
  - - traefik:ingress
    - nova:ingress-metadata
  - - traefik:traefik-route
    - nova:traefik-route-internal
  - - keystone:send-ca-cert
    - nova:receive-ca-cert
  - - placement:placement
    - nova:placement

  - - mysql:database
    - placement:database
  - - keystone:identity-service
    - placement:identity-service
  - - traefik:ingress
    - placement:ingress-internal
  - - keystone:send-ca-cert
    - placement:receive-ca-cert

  - - mysql:database
    - neutron:database
  - - rabbitmq:amqp
    - neutron:amqp
  - - keystone:identity-service
    - neutron:identity-service
  - - traefik:ingress
    - neutron:ingress-internal
  - - tls-operator:certificates
    - neutron:certificates
  - - keystone:send-ca-cert
    - neutron:receive-ca-cert

  - - mysql:database
    - cinder-router:backend-database
  - - cinder:database
    - cinder-router:database
  - - cinder:amqp
    - rabbitmq:amqp
  - - keystone:identity-service
    - cinder:identity-service
  - - traefik:ingress
    - cinder:ingress-internal
  - - keystone:send-ca-cert
    - cinder:receive-ca-cert
  - - glance:image-service
    - cinder:image-service

---
applications:
  rabbitmq:
    offers:
      amqp:
        endpoints:
          - amqp
  tls-operator:
    offers:
      certificates:
        endpoints:
          - certificates
  keystone:
    offers:
      identity-service:
        endpoints:
          - identity-service
      identity-credentials:
        endpoints:
          - identity-credentials
      send-ca-cert:
        endpoints:
          - send-ca-cert
  nova:
    offers:
      nova-service:
        endpoints:
          - nova-service
  cinder-router:
    offers:
      cinder-database:
        endpoints:
          - database
