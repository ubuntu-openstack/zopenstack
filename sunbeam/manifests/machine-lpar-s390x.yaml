# Sunbeam MACHINE-plane bundle for single-LPAR s390x verification.
#
# Hand-rolled equivalent of snap-openstack's machine-side Terraform plans
# (deploy-sunbeam-machine, deploy-openstack-hypervisor, deploy-microceph,
# deploy-cinder-volume), derived verbatim from the upstream zaza test bundle
# sunbeam-charms/tests/openstack/machines.yaml.j2 with the feature charms removed
# (no epa-orchestrator, no manila-data, no microceph RGW).
#
# This is the IAAS half of a two-model deployment. Deploy it into a `machines`
# model on a MANUAL cloud whose only machine ("0") is this LPAR itself, AFTER the
# control-plane bundle is up (its offers must already exist):
#
#   juju add-model machines <manual-cloud>
#   juju add-machine ssh:<user>@<lpar>     # becomes machine 0
#   juju deploy ./machine-lpar-s390x.yaml
#
# The `saas:` block CONSUMES the cross-model offers exported by
# control-plane-k8s-s390x.yaml. URLs assume the K8s control-plane model is named
# `openstack` (admin/openstack.<offer>); adjust if you used a different name.
#
# The OVN control plane now lives on the machine side: microovn owns the NB/SB
# databases and sunbeam-ovn-proxy bridges microovn's ovsdb relation to the
# ovsdb-cms consumers (the hypervisor here, neutron-k8s in the openstack model).
# ovn-central-k8s/ovn-relay-k8s are retired. microcluster-token-distributor is
# required for microovn to join/bootstrap its cluster; charmhub currently has
# no s390x revision for it, so hybrid/local mode must supply a local build.
#
# The upstream Sunbeam machine plan also deploys openstack-network-agents.
# It is included here as a subordinate of microovn so the external bridge is
# mapped to a real host NIC (EXT_NIC) by phase 03b. role-distributor remains
# optional and is omitted from this minimal bundle.
#
# cinder-volume EXPORTS a `storage-backend` offer and sunbeam-ovn-proxy EXPORTS
# `ovsdb-cms`; phase 03b consumes both back into the openstack model.
#
# The hypervisor runs on bare metal (machine 0) for /dev/kvm. microceph uses three
# 2G loop OSDs (single-node profile). Channels follow the published s390x
# revisions. microceph's s390x charm revisions are only on tentacle/* (26.04),
# not squid/stable; hybrid/local modes need a local microceph charm, and the
# release renderer switches this app to tentacle/edge for 26.04.

# Machine 0 is this s390x host (manual cloud). Juju infers the architecture from
# the enrolled machine.
machines:
  "0": {}

applications:
  sunbeam-machine:
    charm: sunbeam-machine
    channel: 2026.1/edge
    scale: 1
    to:
      - "0"
  microcluster-token-distributor:
    charm: microcluster-token-distributor
    channel: v1/stable
    scale: 1
    to:
      - "0"
  microovn:
    charm: microovn
    channel: 26.03/edge
    scale: 1
    to:
      - "0"
  sunbeam-ovn-proxy:
    charm: sunbeam-ovn-proxy
    channel: 2026.1/edge
    scale: 1
    to:
      - "0"
  openstack-network-agents:
    charm: openstack-network-agents
    channel: 2026.1/edge
    options:
      snap-channel: 2026.1/edge
      external-bridge-address: 0.0.0.0/0
  microceph:
    charm: microceph
    channel: squid/stable
    scale: 1
    to:
      - "0"
    options:
      snap-channel: squid/stable
      default-pool-size: 1
    storage:
      osd-standalone: loop,3,2G
  cinder-volume:
    charm: cinder-volume
    channel: 2026.1/edge
    scale: 1
    to:
      - "0"
    options:
      snap-channel: 2026.1/edge
  cinder-microceph:
    charm: cinder-volume-ceph
    channel: 2026.1/edge
    options:
      ceph-osd-replication-count: 1
  hypervisor:
    charm: openstack-hypervisor
    channel: 2026.1/edge
    scale: 1
    to:
      - "0"
    options:
      snap-channel: 2026.1/edge
      external-bridge-address: 0.0.0.0/0

saas:
  amqp:
    url: admin/openstack.amqp
  identity-credentials:
    url: admin/openstack.identity-credentials
  cinder-database:
    url: admin/openstack.cinder-database
  send-ca-cert:
    url: admin/openstack.send-ca-cert
  certificates:
    url: admin/openstack.certificates
  nova-service:
    url: admin/openstack.nova-service

relations:
  - - microcluster-token-distributor:microcluster-cluster
    - microovn:cluster
  - - microovn:ovsdb
    - sunbeam-ovn-proxy:ovsdb
  - - microovn:juju-info
    - openstack-network-agents:juju-info

  - - cinder-volume:amqp
    - amqp:amqp
  - - cinder-volume:identity-credentials
    - identity-credentials:identity-credentials
  - - cinder-volume:database
    - cinder-database
  - - cinder-volume:receive-ca-cert
    - send-ca-cert:send-ca-cert

  - - microceph:ceph
    - cinder-microceph:ceph
  - - cinder-volume:cinder-volume
    - cinder-microceph:cinder-volume
  - - microceph:receive-ca-cert
    - send-ca-cert:send-ca-cert

  - - amqp:amqp
    - hypervisor:amqp
  - - identity-credentials:identity-credentials
    - hypervisor:identity-credentials
  - - send-ca-cert:send-ca-cert
    - hypervisor:receive-ca-cert
  - - sunbeam-ovn-proxy:ovsdb-cms
    - hypervisor:ovsdb-cms
  - - certificates
    - hypervisor:certificates
  - - microovn:certificates
    - certificates:certificates
  - - nova-service
    - hypervisor:nova-service
  - - hypervisor:ceph-access
    - cinder-microceph:ceph-access

---
applications:
  cinder-volume:
    offers:
      storage-backend:
        endpoints:
          - storage-backend
  sunbeam-ovn-proxy:
    offers:
      ovsdb-cms:
        endpoints:
          - ovsdb-cms
